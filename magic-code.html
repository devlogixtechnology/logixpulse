<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Magic Code | Modern App</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Magic Code Login</h1>
                <p class="auth-subtitle">We'll send a 6-digit secure code to your email to sign you in instantly.</p>
            </div>
            
            <form id="magic-code-request-form" class="auth-form" action="verify-code.html" method="GET">
                <div class="form-group">
                    <label for="magic-code-email">Email Address</label>
                    <input 
                        type="email" 
                        id="magic-code-email" 
                        name="email" 
                        placeholder="name@example.com" 
                        required 
                    />
                </div>
                
                <button type="submit" id="magic-code-submit" class="btn btn-primary">Send Magic Code</button>
            </form>

            <div class="auth-footer">
                <a href="index.html" class="auth-link">← Back to Password Login</a>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
