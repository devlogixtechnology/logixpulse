<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Modern App</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Reset password</h1>
                <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>
            </div>
            
            <form class="auth-form" action="set-new-password.html" method="GET">
                <div class="form-group">
                    <label for="reset-email">Email</label>
                    <input 
                        type="email" 
                        id="reset-email" 
                        name="email" 
                        placeholder="Enter your email" 
                        required 
                    />
                </div>
                
                <button type="submit" id="reset-request-submit" class="btn btn-primary">Send Reset Link</button>
            </form>

            <div class="auth-footer margin-top-sm text-center">
                <a href="index.html" class="back-link">← Back to Login</a>
            </div>
        </div>
    </main>
<script src="js/script.js"></script>
</body>
</html>
