<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>REC-FEA-02 Kanban Drag &amp; Drop</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#F9FAFB;--ink:#111827;--mut:#6B7280;--line:#E5E7EB;--card:#fff;--ac:#4F46E5;--acd:#4338CA;--ok:#10B981;--warn:#F59E0B;--bad:#EF4444;--tint:#EEF2FF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);font:700 16px Manrope,Inter,sans-serif}
.top i{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--ac)}
.top em{margin-left:auto;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--tint);color:var(--ac);font:600 12px Inter,sans-serif;font-style:normal}
h1{font:600 22px Manrope,Inter,sans-serif;margin:0;padding:20px 16px 12px}
h1 label{font:400 12px Inter,sans-serif;color:var(--mut)}
.board{display:flex;gap:16px;overflow-x:auto;padding:0 16px 32px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 min(85vw,300px);background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:220px;padding-bottom:8px;scroll-snap-align:start;transition:background .15s,outline-color .15s}
.col.over{outline:2px dashed var(--ac);outline-offset:-2px;background:var(--tint)}
.col h2{margin:0 0 12px;padding:12px 16px;background:var(--tint);border-bottom:1px solid var(--line);font:600 15px Manrope,Inter,sans-serif;display:flex;align-items:center;gap:8px}
.col h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mut)}
.col[data-stage="Contacted"] h2::before{background:var(--ac)}
.col[data-stage="Meeting Booked"] h2::before{background:var(--warn)}
.col[data-stage="Won"] h2::before{background:var(--ok)}
.col[data-stage="Won"] .card{border-left:3px solid var(--ok)}
.col h2 span{margin-left:auto;background:#E0E7FF;color:var(--ac);border-radius:99px;padding:0 10px;font:600 12px Inter,sans-serif}
.col:not(:has(.card))::after{content:"No cards yet";display:block;margin:0 12px;padding:24px 8px;border:1.5px dashed #D1D5DB;border-radius:12px;text-align:center;color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 12px 8px;box-shadow:0 1px 2px #1118270d;touch-action:none;cursor:grab;transition:opacity .25s,transform .2s,box-shadow .15s}
.card:hover{box-shadow:0 4px 12px #11182714}
.card b{display:block;font:600 14px Manrope,Inter,sans-serif}.card small{color:var(--mut);font-size:12px}
.card.drag{opacity:.45;z-index:9;position:relative;cursor:grabbing;transition:none}
.tag{display:inline-block;background:var(--tint);color:var(--ac);border-radius:99px;padding:0 8px;font:500 12px Inter,sans-serif;margin:6px 4px 0 0;border:0;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--acd)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sec:hover{background:var(--bg)}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:2px solid #4F46E540;outline-offset:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;transition:transform .25s;z-index:99}
#toast.on{transform:translateX(-50%)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header class="top"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,12 7,12 10,4 14,20 17,12 21,12"/></svg></i>LogixPulse<em>AL</em></header><h1>Pipeline <label style="font-weight:400;font-size:13px;margin-left:12px"><input type="checkbox" id="fail" style="width:auto"> Simulate network failure</label></h1>
<div class="board" id="board"></div><div id="toast" role="status"></div>
<script>
const DEMO=true, API="api/leads_stage_update.php";
const STAGES=["New Lead","Contacted","Meeting Booked","Won"];
const LEADS=[
{id:1,title:"Website redesign",company:"Nova Textiles",contact_name:"Ayesha Khan",source:"Website",deal_value:4200,stage:"New Lead",tags:["design","urgent"]},
{id:2,title:"Inventory portal",company:"Punjab Traders",contact_name:"Bilal Ahmed",source:"Referral",deal_value:9800,stage:"Contacted",tags:["portal"]},
{id:3,title:"Mobile app MVP",company:"Sargodha Fresh",contact_name:"Hina Malik",source:"Campaign",deal_value:15000,stage:"Meeting Booked",tags:["mobile","urgent"]},
{id:4,title:"CRM setup",company:"Indus Logistics",contact_name:"Usman Raza",source:"Direct",deal_value:6100,stage:"Meeting Booked",tags:["crm"]},
{id:5,title:"E-commerce store",company:"Kohsar Crafts",contact_name:"Sana Iqbal",source:"Website",deal_value:12500,stage:"Won",tags:["shop","design"]}];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const money=n=>"$"+Number(n).toLocaleString();
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2600)}
const board=document.getElementById("board");
board.innerHTML=STAGES.map(s=>'<section class="col" data-stage="'+s+'"><h2>'+s+' <span></span></h2></section>').join("");
LEADS.forEach(l=>{const c=document.createElement("div");c.className="card";c.dataset.id=l.id;
 c.innerHTML="<b>"+esc(l.title)+"</b><small>"+esc(l.company)+" · "+money(l.deal_value)+"</small>";
 board.querySelector('[data-stage="'+l.stage+'"]').append(c)});
const count=()=>board.querySelectorAll(".col").forEach(c=>c.querySelector("span").textContent=c.querySelectorAll(".card").length);count();
async function save(id,stage){
 if(DEMO){await new Promise(r=>setTimeout(r,600));if(document.getElementById("fail").checked)throw new Error("network");return}
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lead_id:id,stage})});
 if(!r.ok||!(await r.json()).ok)throw new Error("failed")}
let d=null;
const colAt=(x,y)=>document.elementsFromPoint(x,y).find(e=>e.classList.contains("col"));
board.addEventListener("pointerdown",e=>{const c=e.target.closest(".card");if(!c)return;
 d={c,from:c.parentElement,sx:e.clientX,sy:e.clientY,on:false};c.setPointerCapture(e.pointerId)});
board.addEventListener("pointermove",e=>{if(!d)return;const dx=e.clientX-d.sx,dy=e.clientY-d.sy;
 if(!d.on&&Math.hypot(dx,dy)<6)return;d.on=true;d.c.classList.add("drag");
 d.c.style.transform="translate("+dx+"px,"+dy+"px)";
 board.querySelectorAll(".col").forEach(c=>c.classList.toggle("over",c===colAt(e.clientX,e.clientY)))});
board.addEventListener("pointerup",async e=>{if(!d)return;const {c,from,on}=d;d=null;
 const to=colAt(e.clientX,e.clientY);c.classList.remove("drag");c.style.transform="";
 board.querySelectorAll(".col").forEach(x=>x.classList.remove("over"));
 if(!on||!to||to===from)return;
 const next=c.nextElementSibling;to.append(c);count();
 try{await save(+c.dataset.id,to.dataset.stage)}
 catch(err){from.insertBefore(c,next&&next.parentElement===from?next:null);count();toast("Update failed. Card moved back.")}
});
board.addEventListener("pointercancel",()=>{if(d){d.c.classList.remove("drag");d.c.style.transform="";d=null}});
</script></html>
