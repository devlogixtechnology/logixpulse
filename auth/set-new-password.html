<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | LogixPulse</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Set new password</h1>
                <p class="auth-subtitle">Your new password must be different from previous used passwords.</p>
            </div>
            
            <form id="set-new-password-form" class="auth-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input 
                        type="password" 
                        id="new-password" 
                        name="newPassword" 
                        placeholder="••••••••" 
                        required 
                    />
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirm-password" 
                        name="confirmPassword" 
                        placeholder="••••••••" 
                        required 
                    />
                </div>

                <button type="submit" id="set-password-submit" class="btn btn-primary">Reset Password</button>
            </form>

            <div class="auth-footer margin-top-sm">
                <a href="../index.html" class="auth-link">← Back to Login</a>
            </div>
        </div>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
