<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>
<style>
  :root {
    /* Exact tokens from LogixPulse Design System & Component Spec */
    --primary-indigo: #4F46E5;   /* Primary Brand */
    --primary-hover: #4338CA;    /* Primary Hover / Active-Pressed */
    --success-emerald: #10B981; /* Won / Paid */
    --warning-amber: #F59E0B;   /* Pending / Review */
    --danger-red: #EF4444;      /* Destructive */
    --canvas: #F8FAFB;          /* Neutral Canvas, base viewport surface */
    --pure-surface: #FFFFFF;    /* Pure Surface, elevated containers */
    --primary-text: #111827;
    --muted-text: #6B7280;
    --dark-nav: #111827;        /* Dark Navigation / Sidebar Surface */
    --border: #E5E7EB;

    --accent: var(--primary-indigo);
    --accent-soft: rgba(79, 70, 229, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--canvas);
    color: var(--primary-text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 24px;
  }

  .board-title {
    font-size: 20px;
    font-weight: 700;
    font-family: 'Manrope', -apple-system, sans-serif;
    color: var(--primary-text);
    margin: 0 0 4px;
  }

  .board-subtitle {
    font-size: 13px;
    color: var(--muted-text);
    margin: 0 0 20px;
  }

  /* The board: equal-width columns, wraps to horizontal scroll on narrow screens */
  .board {
    display: flex;
    gap: 16px;
    width: 100%;
    align-items: flex-start;
  }

  .column {
    flex: 1 1 0;
    min-width: 0;
    background: var(--pure-surface);
    border: 1px solid var(--border);
    border-radius: 12px; /* Modular Cards/Modals rounded-xl per spec */
    display: flex;
    flex-direction: column;
    min-height: 420px;
    box-shadow: 0 1px 3px rgba(17, 24, 39, 0.04);
  }

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    border-radius: 12px 12px 0 0;
  }

  .column-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .column-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .column-title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .column-count {
    font-size: 12px;
    color: var(--primary-indigo);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 20px;
    flex-shrink: 0;
    font-weight: 600;
  }

  .column-body {
    flex: 1;
    padding: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .column-empty {
    width: 100%;
    border: 1.5px dashed var(--border);
    border-radius: 8px; /* Standard UI rounded-lg per spec */
    padding: 28px 12px;
    text-align: center;
    color: var(--muted-text);
    font-size: 13px;
  }

  /* Column accents mapped to the spec's semantic status colors */
  .column[data-col="backlog"] .column-header { background: #F3F4F6; }
  .column[data-col="backlog"] .column-dot { background: var(--muted-text); }

  .column[data-col="todo"] .column-header { background: var(--accent-soft); }
  .column[data-col="todo"] .column-dot { background: var(--primary-indigo); }

  .column[data-col="inprogress"] .column-header { background: rgba(245, 158, 11, 0.12); }
  .column[data-col="inprogress"] .column-dot { background: var(--warning-amber); }

  .column[data-col="done"] .column-header { background: rgba(16, 185, 129, 0.12); }
  .column[data-col="done"] .column-dot { background: var(--success-emerald); }

  /* Responsive: below 700px, columns become a horizontally scrollable row
     instead of squeezing to unreadable widths */
  @media (max-width: 700px) {
    .board {
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .column {
      flex: 0 0 240px;
    }
  }
</style>
</head>
<body>

  <h1 class="board-title">Sprint Board</h1>
  <p class="board-subtitle">Empty layout — columns only, no cards yet</p>

  <div class="board">
    <div class="column" data-col="backlog">
      <div class="column-header">
        <div class="column-header-left">
          <span class="column-dot"></span>
          <span class="column-title">Backlog</span>
        </div>
        <span class="column-count">0</span>
      </div>
      <div class="column-body">
        <div class="column-empty">No cards yet</div>
      </div>
    </div>

    <div class="column" data-col="todo">
      <div class="column-header">
        <div class="column-header-left">
          <span class="column-dot"></span>
          <span class="column-title">To Do</span>
        </div>
        <span class="column-count">0</span>
      </div>
      <div class="column-body">
        <div class="column-empty">No cards yet</div>
      </div>
    </div>

    <div class="column" data-col="inprogress">
      <div class="column-header">
        <div class="column-header-left">
          <span class="column-dot"></span>
          <span class="column-title">In Progress</span>
        </div>
        <span class="column-count">0</span>
      </div>
      <div class="column-body">
        <div class="column-empty">No cards yet</div>
      </div>
    </div>

    <div class="column" data-col="done">
      <div class="column-header">
        <div class="column-header-left">
          <span class="column-dot"></span>
          <span class="column-title">Done</span>
        </div>
        <span class="column-count">0</span>
      </div>
      <div class="column-body">
        <div class="column-empty">No cards yet</div>
      </div>
    </div>
  </div>

</body>
</html>
