<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Modern App</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Please enter your details to sign in.</p>
            </div>
            
            <form id="traditional-login-form" class="auth-form" action="client-portal-dashboard/index.php" method="GET">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input 
                        type="email" 
                        id="login-email" 
                        name="email" 
                        placeholder="Enter your email" 
                        required 
                    />
                </div>
                
                <div class="form-group">
                    <div class="label-row">
                        <label for="login-password">Password</label>
                        <a href="reset-password.html" class="auth-link-small" id="forgot-password-link">Forgot password?</a>
                    </div>
                    <input 
                        type="password" 
                        id="login-password" 
                        name="password" 
                        placeholder="••••••••" 
                        required 
                    />
                </div>

                <button type="submit" id="login-submit" class="btn btn-primary">Sign In</button>
            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <div class="auth-footer">
                <p>Want a passwordless experience?</p>
                <a href="magic-code.html" class="btn btn-outline magic-link-btn">Log in with Magic Code</a>
            </div>
        </div>
    </main>

</body>
</html>
