<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LogixPulse Client Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="auth-navbar">
        <div class="auth-navbar-inner">
            <div class="auth-navbar-brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="2 12 8 12 10 6 14 18 16 12 22 12"></polyline>
                    </svg>
                </span>
                <span>LogixPulse <span class="auth-navbar-brand-subtext">Client Portal</span></span>
            </div>
            <a href="#" class="auth-navbar-cta">Don't have an invite? <span class="auth-navbar-cta-link">Contact us</span></a>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-page-inner">

            <div class="auth-heading">
                <h1>Sign in to <span class="text-accent">your Client Portal</span></h1>
            </div>

            <div class="auth-card">
                <form id="traditional-login-form" class="auth-form" action="client-portal-dashboard/index.php" method="GET">
                    <div class="form-group">
                        <label for="login-email">Email address</label>
                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="password-field">
                            <input
                                type="password"
                                id="login-password"
                                name="password"
                                placeholder="••••••••"
                                required
                            />
                            <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password" aria-pressed="false">
                                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-submit" class="btn btn-primary">Sign In</button>
                </form>
            </div>

            <div class="auth-footer-links">
                <p>Forgot your password? <a href="reset-password.html" id="forgot-password-link">Get help signing in</a></p>
                <p>Prefer not to use passwords? <a href="magic-code.html">Sign in with magic link</a></p>
            </div>

        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var toggle = document.getElementById('password-toggle');
            var input = document.getElementById('login-password');
            if (toggle && input) {
                toggle.addEventListener('click', function () {
                    var isHidden = input.type === 'password';
                    input.type = isHidden ? 'text' : 'password';
                    toggle.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
                    toggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
                    toggle.querySelector('.icon-eye').style.display = isHidden ? 'none' : 'block';
                    toggle.querySelector('.icon-eye-off').style.display = isHidden ? 'block' : 'none';
                });
            }
        });
    </script>
</body>
</html>
